<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ASCII Fireworks" />
    <meta name="theme-color" content="#000000" />
    <title>ASCII Fireworks</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Preload external resources for better performance -->
    <link rel="preload" as="script" href="https://pixijs.download/release/pixi.min.js" />
    <!-- Preload Tone.js so the library is fetched early but executed when available -->
    <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
        crossorigin="anonymous" />
</head>

<body>
    <main id="game-container" role="main" aria-label="Game container"></main>
    <aside id="ui-layer" role="complementary" aria-label="UI controls">
        <div id="combo-counter" class="combo-counter" hidden aria-live="polite" aria-label="Combo counter">
            Combo: <span id="combo-value">0</span>
        </div>
    </aside>

    <!-- Scripts -->
    <!-- Load Tone.js deferred so it doesn't block parsing but executes before DOMContentLoaded -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer crossorigin="anonymous"></script>
    <script src="https://pixijs.download/release/pixi.min.js" defer></script>
    <script type="module" src="js/main.js" defer></script>

    <!-- No-script fallback -->
    <noscript>
        This application requires JavaScript to be enabled. Please enable JavaScript in your browser settings.
    </noscript>
</body>

</html>
